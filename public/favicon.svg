<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Planet Radial Gradient -->
    <radialGradient id="planetSphereFavicon" cx="42%" cy="38%" r="65%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#A0F0DF" />
      <stop offset="25%" stop-color="#70C3D4" />
      <stop offset="65%" stop-color="#3474BE" />
      <stop offset="100%" stop-color="#1D4088" />
    </radialGradient>
    
    <!-- Ring Gradient -->
    <linearGradient id="planetRingFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70C3D4" />
      <stop offset="50%" stop-color="#A0F0DF" />
      <stop offset="100%" stop-color="#3474BE" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlowFavicon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Projected Shadow -->
  <ellipse cx="100" cy="172" rx="55" ry="8" fill="#02040A" opacity="0.85" />

  <!-- Ring Back Arc -->
  <g transform="rotate(-18, 100, 100)">
    <path d="M 22 100 A 78 20 0 0 1 178 100" stroke="url(#planetRingFavicon)" stroke-width="11" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Planet Main Sphere -->
  <circle cx="100" cy="100" r="48" fill="url(#planetSphereFavicon)" stroke="#1D4088" stroke-width="2.5" />

  <!-- Ring Front Arc -->
  <g transform="rotate(-18, 100, 100)">
    <path d="M 178 100 A 78 20 0 0 1 22 100" stroke="url(#planetRingFavicon)" stroke-width="11" stroke-linecap="round" />
  </g>

  <!-- Central Light / Spot Glow -->
  <circle cx="86" cy="80" r="10" fill="#A0F0DF" filter="url(#neonGlowFavicon)" opacity="0.5" pointer-events="none" />
  <circle cx="84" cy="78" r="4" fill="#FFFFFF" opacity="0.8" pointer-events="none" />
</svg>
